services:
  postgres:
    image: postgres:16-alpine
    container_name: aiiam_postgres
    restart: always
    environment:
      POSTGRES_DB: aiiam_db
      POSTGRES_USER: aiiam_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-supersecretpassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiiam_user -d aiiam_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  opa:
    # The default `openpolicyagent/opa:latest` image is a minimal static
    # binary with no shell, so a CMD-based healthcheck can't run inside it
    # at all — `condition: service_healthy` below would then block the
    # backend from starting forever. The `-debug` variant adds a busybox
    # shell, but (verified against this image) its busybox build has no
    # http client applet either — no wget, no curl, no nc. What it *does*
    # have is `netstat`, so the healthcheck confirms OPA's server is bound
    # and accepting connections on :8181 rather than making an actual HTTP
    # request. That's a weaker signal than a real `/health` check — it
    # can't tell an OPA that's up from one whose HTTP layer is wedged —
    # but it is honest about what this image can verify, and it's enough
    # to gate `depends_on: condition: service_healthy` correctly.
    image: openpolicyagent/opa:latest-debug
    container_name: aiiam_opa
    restart: always
    command:
      - "run"
      - "--server"
      - "--log-level=info"
      - "--addr=0.0.0.0:8181"
      - "/policies"
    ports:
      - "8181:8181"
    volumes:
      - ./backend/policies:/policies:ro
    healthcheck:
      test: ["CMD-SHELL", "netstat -tln | grep -q ':8181 '"]
      interval: 15s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: aiiam_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      opa:
        condition: service_healthy
    environment:
      APP_NAME: "AI-IAM Platform"
      APP_VERSION: "1.0.0"
      DEBUG: "true"
      DATABASE_URL: "postgresql+asyncpg://aiiam_user:${DB_PASSWORD:-supersecretpassword}@postgres:5432/aiiam_db"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-default_super_secret_jwt_key_256_bit_string}"
      OPA_URL: "http://opa:8181/v1/data/ai_iam/rebac/allow"
      SPIRE_AGENT_SOCKET: "unix:///tmp/spire-agent/public/api.sock"
      SPIFFE_TRUST_DOMAIN: "ai-iam.internal"
      BCRYPT_ROUNDS: "12"
      MAX_DELEGATION_DEPTH: "5"
    ports:
      - "8000:8000"
    command: >
      bash -c "
        python -m alembic upgrade head &&
        python ../scripts/seed_db.py &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  frontend:
    image: node:20-alpine
    container_name: aiiam_frontend
    working_dir: /app/frontend
    volumes:
      - ../frontend:/app/frontend
    ports:
      - "5173:5173"
    command: bash -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
