services:
  postgres:
    # Pinned by digest (Slice 15), not just the ":16-alpine" tag — a tag
    # can be silently repointed at a different image upstream at any
    # time; a digest is the actual content, immune to that. Re-resolve
    # deliberately (`docker pull postgres:16-alpine && docker inspect
    # ... RepoDigests`) to pick up a real security patch — don't let it
    # drift silently, but don't let it drift accidentally either.
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: aiiam_postgres
    restart: always
    environment:
      POSTGRES_DB: aiiam_db
      POSTGRES_USER: aiiam_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-supersecretpassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiiam_user -d aiiam_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  opa:
    # The default `openpolicyagent/opa:latest` image is a minimal static
    # binary with no shell, so a CMD-based healthcheck can't run inside it
    # at all — `condition: service_healthy` below would then block the
    # backend from starting forever. The `-debug` variant adds a busybox
    # shell, but (verified against this image) its busybox build has no
    # http client applet either — no wget, no curl, no nc. What it *does*
    # have is `netstat`, so the healthcheck confirms OPA's server is bound
    # and accepting connections on :8181 rather than making an actual HTTP
    # request. That's a weaker signal than a real `/health` check — it
    # can't tell an OPA that's up from one whose HTTP layer is wedged —
    # but it is honest about what this image can verify, and it's enough
    # to gate `depends_on: condition: service_healthy` correctly.
    # Pinned by digest (Slice 15) — see the postgres service's comment
    # above for why. "latest-debug" as a TAG would otherwise silently
    # point at a different actual image the next time it's re-pulled.
    image: openpolicyagent/opa:latest-debug@sha256:f37df2fabfe6e3d5f62579b21dbba2c4054738c3e699dac5bf4521b1370494f8
    container_name: aiiam_opa
    restart: always
    command:
      - "run"
      - "--server"
      - "--log-level=info"
      - "--addr=0.0.0.0:8181"
      - "/policies"
    ports:
      - "8181:8181"
    volumes:
      # ../ , not ./ — this compose file lives in docker/, so a bare
      # ./backend/policies resolved to docker/backend/policies (an
      # empty, silently auto-created directory) instead of the real
      # backend/policies at the project root. Invisible for as long as
      # the directory had no real content to be missing; confirmed via
      # `docker inspect aiiam_opa` once it mattered.
      - ../backend/policies:/policies:ro
    healthcheck:
      test: ["CMD-SHELL", "netstat -tln | grep -q ':8181 '"]
      interval: 15s
      timeout: 5s
      retries: 3

  redis:
    # Revocation index (JTI blacklist) — see app/core/revocation.py.
    # Plain redis-alpine has a real `redis-cli` in the image, so the
    # healthcheck can be a genuine PING rather than a port-bound proxy
    # check (contrast with the OPA service above, which has no HTTP
    # client available at all).
    # Pinned by digest (Slice 15) — see the postgres service's comment above.
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: aiiam_redis
    restart: always
    ports:
      # 6380 on the host — another project's redis (buildit-redis-1)
      # already holds 6379 on this machine. Only the internal
      # docker_default network hostname/port (redis:6379) matters to the
      # backend; the host mapping is for optional local debugging only.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: aiiam_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      opa:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: "AI-IAM Platform"
      APP_VERSION: "1.0.0"
      DEBUG: "true"
      DATABASE_URL: "postgresql+asyncpg://aiiam_user:${DB_PASSWORD:-supersecretpassword}@postgres:5432/aiiam_db"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-default_super_secret_jwt_key_256_bit_string}"
      # Bare origin only — app/core/permissions.py appends OPA_POLICY_PATH
      # itself (defaults to v1/data/aiiam/authz, matching
      # backend/policies/authz.rego's package). This was previously set
      # to a full (and wrongly-named) data path, which permissions.py
      # then appended the real path onto — producing a doubly-broken,
      # nonexistent URL that OPA would 404 on every real request.
      OPA_URL: "http://opa:8181"
      SPIRE_AGENT_SOCKET: "unix:///tmp/spire-agent/public/api.sock"
      SPIFFE_TRUST_DOMAIN: "ai-iam.internal"
      BCRYPT_ROUNDS: "12"
      MAX_DELEGATION_DEPTH: "5"
      # Audit-log writer's own least-privileged Postgres role — see
      # migration 0003_audit_log_durability (creates the role/grants) and
      # app/db/session.py's audit_engine (connects as it). Same variable
      # name the migration itself reads, so they can never drift apart.
      AUDIT_DB_PASSWORD: "${AUDIT_DB_PASSWORD:-audit_writer_dev_password}"
      REDIS_URL: "redis://redis:6379/0"
    volumes:
      # RS256 keypair, mounted in — never baked into the image (see
      # .dockerignore: backend/keys/ is deliberately excluded from the
      # build context so a private key never ends up in an image
      # layer). Generate with scripts/generate_keys.sh before first run.
      # A real deployment's secret management (Vault, cloud KMS, an
      # orchestrator's native secrets) is a separate, later concern —
      # this is the local-dev equivalent.
      - ../backend/keys:/app/backend/keys:ro
    ports:
      - "8000:8000"
    # Hardening (Slice 15): the app writes nothing to its own container
    # filesystem at runtime — audit goes to Postgres, logs go to
    # stdout, PYTHONDONTWRITEBYTECODE=1 already stops .pyc writes — so a
    # read-only root filesystem costs nothing and closes off writing a
    # webshell/backdoor into a running container as an attack primitive
    # even after some other compromise. tmpfs gives the small amount of
    # /tmp scratch space Python's stdlib itself sometimes wants (e.g.
    # tempfile) without punching a real filesystem hole for it.
    # cap_drop/no-new-privileges are the standard cheap Docker hardening
    # pair — this process needs no Linux capabilities at all and must
    # never be able to gain more privilege than it started with (e.g.
    # via a setuid binary), and it already runs as non-root (see the
    # Dockerfile's USER aiiam).
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # --workers 4, not --reload (Slice 15): --reload's file-watching has
    # no place outside active local editing, and this compose file is
    # meant to reflect a real deployment topology now, matching the
    # Dockerfile's own CMD. Running multiple workers here is also what
    # actually exercises the credential-rotator / audit-verifier
    # advisory-lock fix under the real failure condition it fixes —
    # under a single worker (the old --reload setup), the "4 processes
    # racing to rotate the same keys" bug could never have manifested
    # in this environment in the first place.
    command: >
      bash -c "
        python -m alembic upgrade head &&
        python ../scripts/seed_db.py &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
      "

  frontend:
    # Pinned by digest (Slice 15) — see the postgres service's comment above.
    image: node:20-alpine@sha256:fb4cd12c85ee03686f6af5362a0b0d56d50c58a04632e6c0fb8363f609372293
    container_name: aiiam_frontend
    working_dir: /app/frontend
    volumes:
      - ../frontend:/app/frontend
    ports:
      - "5173:5173"
    environment:
      # See vite.config.js's comment — "backend", the compose service's
      # own DNS name on this network, not "localhost" (which inside
      # THIS container means itself, not aiiam_backend).
      VITE_BACKEND_URL: "http://backend:8000"
    # sh, not bash (Slice 16, found live): node:20-alpine has no bash —
    # `bash -c "..."` failed with "Cannot find module '/app/frontend/
    # bash'" because the image's own entrypoint script, unable to find
    # a `bash` executable on PATH, fell through to executing `node bash
    # -c "..."` instead. This container had been crash-looping on every
    # single `docker compose up` in this project's history; nothing
    # before this slice ever exercised the frontend enough to notice.
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
